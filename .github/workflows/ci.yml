name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (amd64, loaded for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: laya-serve:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name laya-serve -p 8000:8000 laya-serve:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' laya-serve)" = healthy ] && break
            sleep 5
          done
          python3 scripts/smoke.py
      - name: Publish (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image=ghcr.io/${{ github.repository_owner }}/laya-serve:${GITHUB_REF_NAME#v}
          docker tag laya-serve:ci "$image"
          docker push "$image"
