name: CI

# Builds and smoke-tests the image on native amd64 and arm64 runners. A `v*` tag also
# publishes two variants to Docker Hub, each as one multi-arch tag:
#   <namespace>/laya-serve:<version>      english + multilingual (the default)
#   <namespace>/laya-serve:<version>-en   english only, about 0.7 GB smaller
# (and :latest / :latest-en for a final release).
#
# Repository settings:
#   secrets   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (a Docker Hub access token, Read & Write)
#   variable  DOCKERHUB_NAMESPACE (optional; the user or organization, defaults to the username)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  image:
    name: Build + smoke (${{ matrix.arch }}, ${{ matrix.variant }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - {arch: amd64, runner: ubuntu-24.04, variant: full, models: "english,multilingual"}
          - {arch: arm64, runner: ubuntu-24.04-arm, variant: full, models: "english,multilingual"}
          - {arch: amd64, runner: ubuntu-24.04, variant: en, models: "english"}
          - {arch: arm64, runner: ubuntu-24.04-arm, variant: en, models: "english"}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # the image is ~2.7 GB and its build stages need several more
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: laya-serve:ci
          build-args: LAYA_MODELS=${{ matrix.models }}
          # the english variant reuses the full build's dependency layers and caches nothing itself
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ matrix.variant == 'full' && format('type=gha,scope={0},mode=max', matrix.arch) || '' }}

      - name: Smoke test
        run: |
          docker run -d --name laya-serve -p 8000:8000 laya-serve:ci
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' laya-serve)" = healthy ] && break
            sleep 5
          done
          python3 scripts/smoke.py || { docker logs laya-serve | tail -50; exit 1; }

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image name
        if: startsWith(github.ref, 'refs/tags/v')
        run: echo "IMAGE=docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/laya-serve" >> "$GITHUB_ENV"

      # same build, from the cache: pushed by digest, tagged by the merge job
      - name: Push by digest
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: LAYA_MODELS=${{ matrix.models }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Keep the digest
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    name: Publish multi-arch tag (${{ matrix.variant }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - {variant: full, suffix: ""}
          - {variant: en, suffix: "-en"}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ matrix.variant }}-*
          merge-multiple: true
          path: /tmp/digests

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push the manifest list
        working-directory: /tmp/digests
        env:
          IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}/laya-serve
          SUFFIX: ${{ matrix.suffix }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tags=(-t "$IMAGE:$version$SUFFIX")
          # 0.4.7-1 is a rebuild of laya 0.4.7 and moves :latest; 0.5.0-rc.1 (alpha/beta/rc) never does
          [[ "$version" =~ -(alpha|beta|rc) ]] || tags+=(-t "$IMAGE:latest$SUFFIX")
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$version$SUFFIX"
